services:
  kwhwise:
    image: kwhwise:local
    build: .
    restart: unless-stopped
    read_only: true
    environment:
      ELECTRICITY_PROVIDER: ${ELECTRICITY_PROVIDER:-nrgi}
      REGION: ${REGION:-DK2}
      GRID_OPERATOR: ${GRID_OPERATOR:-cerius}
      SPOT_PRICE_MARKUP_ORE: ${SPOT_PRICE_MARKUP_ORE:-9}
      SPOT_PRICE_MARKUP_VAT: ${SPOT_PRICE_MARKUP_VAT:-included}
      MQTT_HOST: ${MQTT_HOST:?Set MQTT_HOST to your existing broker hostname or IP}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_TLS: ${MQTT_TLS:-false}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-kwhwise}
      MQTT_BASE_TOPIC: ${MQTT_BASE_TOPIC:-kwhwise}
      MQTT_DISCOVERY_PREFIX: ${MQTT_DISCOVERY_PREFIX:-homeassistant}
      TZ: ${TZ:-Europe/Copenhagen}
