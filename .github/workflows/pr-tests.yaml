name: PR Test

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-pr-title:
    name: Verify PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commit PR title
        uses: amannn/action-semantic-pull-request@v5
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            style
            revert
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-test:
    name: Go Test & Build
    needs: verify-pr-title
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Verify Go code
        uses: ./.github/actions/go-checks
      - name: Set up Node.js for release-tool tests
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install release-tool dependencies
        run: npm ci --ignore-scripts
      - name: Test release handoff
        run: npm run test:release
